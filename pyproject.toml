[project]
name = "RelICL"
version = "0.1.0"
description = ""
authors = [
    { name = "Simon Forbat", email = "simon.forbat@uni-mannheim.de" },
    { name = "Rainer Gemulla", email = "rgemulla@uni-mannheim.de" },
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch (>=2.12.1,<3.0.0)",
    "numpy (<2.5)",
    "pandas (>=3.0.3,<4.0.0)",
    "skrub (>=0.9)",
    "relbench (>=2.1.2,<3.0.0)",
    "torch-geometric (>=2.6.1,<3.0.0)",
    "pyg-lib (>=0.7.0,<0.8.0)",
    "torch-scatter (>=2.1.2,<3.0.0)",
    "torch-sparse (>=0.6.18,<0.7.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "networkx (>=3.5,<4.0)",
    "pytorch-frame (>=0.3.0,<0.4.0)",
    "sentence-transformers (>=5.2.0,<6.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "ordered-set (>=4.1.0,<5.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "tabicl (>=2.1.1,<3.0.0)",
    "dask (>=2026.3.0,<=2027.0.0)",
    "scikit-learn (>=1.0,<=1.6.1)",
    "termcolor (>=3.3.0,<4.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "matplotlib (>=3.10,<4.0.0)",
    "duckdb (>=1.5.5,<2.0.0)",
    "tabpfn (>=8.0.8,<9.0.0)",
    "tabfm[pytorch] @ git+https://github.com/google-research/tabfm.git@b8a8b090c66d1b9e7af278003461582219996b6a",
    "pandas-stubs (>=3.0.5,<3.1.0)",
]

[dependency-groups]
dev = [
    "pytest-cov (>=7.0.0,<8.0.0)",
    "ruff (>=0.15.6,<0.16.0)",
    "types-networkx (>=3.6.1.20260408,<4.0.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "coverage (>=7.14.1,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pandas-stubs (>=3.0.3.260530,<4.0.0.0)",
    "scipy-stubs (>=1.18.0,<1.19.0)",
]

viz = [
    "pygraphviz (>=2.0)",
    "pycairo (>=1.14.0)",
    "pygobject",
    "plotly (>=6.7.0,<7.0.0)",
    "kaleido (>=1.3.0,<2.0.0)",
]

hpo = [
    "optuna (>=4.9.0,<5.0.0)",
    "optuna-dashboard (>=0.20.0,<0.21.0)",
]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.viz]
optional = true

[tool.poetry.group.hpo]
optional = true

[tool.poetry]
packages = [
    { include = "relicl", from = "src" },
    { include = "hpo", from = "src" },
    { include = "paper", from = "src" },
]

[tool.poetry.scripts]
relicl = "relicl.cli:main"
yaml2csv = "relicl.cli:yaml2csv"
hpo = "hpo.cli:hpo"
analysis = "hpo.cli:analysis"
combined-analysis = "hpo.cli:combined_analysis"
test-top-k = "hpo.test_top_k:main"
paper = "paper.cli:main"

[tool.poetry.dependencies]
torch = {source = "torch"}
pyg-lib = {source = "pytorch-geometric"}
torch-scatter = { source = "pytorch-geometric" }
torch-sparse = { source = "pytorch-geometric" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "torch"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-geometric"
url = "https://data.pyg.org/whl/torch-2.12.1+cu130.html"
priority = "explicit"

[tool.mypy]
# ignore all missing imports
ignore_missing_imports = true

[tool.ruff]
# Sort imports.
lint.select = ["I"]
